version: "3.9"

services:

  frontend:

    build: ./frontend

    container_name: movienet_frontend

    ports:

      - "3000:3000"

    depends_on:

      - backend

    restart: always

  backend:

    build: ./backend

    container_name: movienet_backend

    ports:

      - "8000:8000"

    restart: always

    env_file:

      - .env

    depends_on:

      - postgres

  postgres:

    image: postgres:16

    container_name: movienet_database

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: password

      POSTGRES_DB: movienet

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
